<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <link rel="icon" type="image/x-icon" href="markdown3.ico">
    <link rel="stylesheet" id="hljs-theme" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script>
    (function () {
        var t = localStorage.getItem('mdTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') {
            document.getElementById('hljs-theme').href =
                'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
        }
    })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-bar" id="topBar">
            <div class="controls">
                <button id="clearAllBtn" class="clear-all-btn" title="Clear All" aria-label="Clear All"></button>
                <button id="openBtn" class="btn-primary">Open MD File</button>
                <button id="openFolderBtn" class="btn-primary">Open Folder</button>
                <button id="closeFolderBtn" class="btn-secondary" title="Close Folder" hidden>Close Folder</button>
                <button id="minimizeBtn" class="btn-icon" title="Minimize toolbar" aria-label="Minimize toolbar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <button id="themeToggleBtn" class="btn-icon" title="Switch to light mode" aria-label="Switch to light mode">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
                <input type="file" id="fileInput" accept=".md,.markdown" multiple style="display: none;">
                <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
            </div>
            <div class="tabs-container" id="tabsContainer">
                <!-- Tabs will be added here -->
            </div>
        </div>
        <div class="content-area" id="contentArea">
            <div class="explorer-panel" id="explorerPanel" style="display: none;">
                <div class="explorer-header">
                    <h3 id="folderName">Explorer</h3>
                    <button id="syncFolderBtn" class="btn-icon explorer-sync-btn" title="Sync Folder" aria-label="Sync Folder" hidden>
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    </button>
                </div>
                <div class="explorer-content" id="explorerContent">
                    <!-- File tree will be added here -->
                </div>
            </div>
            <div class="markdown-container" id="markdownContainer">
                <div id="emptyState" class="empty-state">
                    <p>No file open. Click "Open MD File" to start.</p>
                </div>
                <!-- Preview content will be injected here -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
